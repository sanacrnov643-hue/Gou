        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build APK
        run: |
          cd apkproj
          for i in 1 2 3 4; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Попытка $i не удалась, жду и повторяю"
            sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Builds-apk
          path: apkproj/app/build/outputs/apk/debug/app-debug.apk
